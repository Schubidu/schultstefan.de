name: Format PR once

on:
  push:
    branches:
      - modernize/689-foundation
    paths:
      - .github/workflows/format-pr-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Check
        run: npm run check

      - name: Commit formatting
        run: |
          if git diff --quiet -- index.html public/index.css public/profile-links.css; then
            echo "UI files are already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.css public/profile-links.css
          git commit -m "style: format shipped UI"
          git push
