name: Generate OpenGraph image once

on:
  push:
    branches:
      - feat/open-graph-refresh
    paths:
      - .github/workflows/generate-og-once.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Render OpenGraph image
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/open-graph.html" <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <style>
                * { box-sizing: border-box; }
                html, body {
                  width: 1200px;
                  height: 630px;
                  margin: 0;
                  overflow: hidden;
                }
                body {
                  position: relative;
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  background:
                    linear-gradient(90deg, rgba(4, 18, 20, 0.16), rgba(4, 18, 20, 0.03)),
                    url("https://images.unsplash.com/photo-1595452105726-284dc99f5ec4?auto=format&fit=crop&fm=jpg&q=90&w=2400") center center / cover no-repeat;
                }
                .crystal {
                  position: absolute;
                  left: 54px;
                  top: 92px;
                  width: 735px;
                  min-height: 400px;
                  padding: 58px 62px 50px;
                  overflow: hidden;
                  background: rgba(246, 252, 252, 0.78);
                  border: 1px solid rgba(255, 255, 255, 0.72);
                  box-shadow:
                    0 30px 70px rgba(1, 15, 17, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.9);
                  backdrop-filter: blur(18px) saturate(1.16);
                  clip-path: polygon(0 0, 91% 0, 100% 18%, 100% 100%, 8% 100%, 0 88%);
                }
                .crystal::before,
                .crystal::after {
                  content: "";
                  position: absolute;
                  pointer-events: none;
                }
                .crystal::before {
                  inset: 0;
                  background:
                    linear-gradient(128deg, rgba(255,255,255,0.44), transparent 33%),
                    linear-gradient(310deg, rgba(93, 218, 204, 0.14), transparent 32%);
                }
                .crystal::after {
                  width: 380px;
                  height: 2px;
                  left: -70px;
                  bottom: 60px;
                  transform: rotate(-13deg);
                  background: linear-gradient(90deg, transparent, rgba(119, 236, 224, 0.74), rgba(255,255,255,0.95), transparent);
                  box-shadow: 0 0 14px rgba(119, 236, 224, 0.28);
                }
                .content { position: relative; z-index: 1; }
                h1 {
                  margin: 0 0 22px;
                  color: #081c1e;
                  font-size: 76px;
                  line-height: 0.98;
                  letter-spacing: -2.6px;
                  font-weight: 720;
                }
                .role {
                  margin: 0 0 26px;
                  color: #173639;
                  font-size: 37px;
                  line-height: 1.12;
                  font-weight: 480;
                  letter-spacing: -0.8px;
                }
                .focus {
                  margin: 0;
                  color: #244a4d;
                  font-size: 27px;
                  line-height: 1.2;
                  font-weight: 500;
                  letter-spacing: 0.1px;
                }
                .credit {
                  position: absolute;
                  right: 28px;
                  bottom: 22px;
                  padding: 8px 12px;
                  border-radius: 9px;
                  color: rgba(255,255,255,0.92);
                  background: rgba(3, 16, 17, 0.45);
                  font-size: 17px;
                  letter-spacing: 0.1px;
                  text-shadow: 0 1px 2px rgba(0,0,0,0.35);
                  backdrop-filter: blur(8px);
                }
              </style>
            </head>
            <body>
              <section class="crystal">
                <div class="content">
                  <h1>Stefan Schult</h1>
                  <p class="role">Senior Software Engineer</p>
                  <p class="focus">Identity · Developer Tooling · Web</p>
                </div>
              </section>
              <div class="credit">Photo · Floh Keitgen / Unsplash</div>
            </body>
          </html>
          HTML

          google-chrome --headless --disable-gpu --no-sandbox --hide-scrollbars \
            --force-device-scale-factor=1 --virtual-time-budget=5000 \
            --window-size=1200,630 \
            --screenshot=public/assets/socialsharing.png \
            "file://$RUNNER_TEMP/open-graph.html"

      - name: Verify dimensions
        run: |
          file public/assets/socialsharing.png
          python - <<'PY'
          import struct
          with open('public/assets/socialsharing.png', 'rb') as image:
              image.read(16)
              width, height = struct.unpack('>II', image.read(8))
          if (width, height) != (1200, 630):
              raise SystemExit(f'Expected 1200x630, got {width}x{height}')
          print(f'OpenGraph image: {width}x{height}')
          PY

      - name: Commit image
        run: |
          if git diff --quiet -- public/assets/socialsharing.png; then
            echo "OpenGraph image is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/socialsharing.png
          git commit -m "feat: refresh OpenGraph image"
          git push
