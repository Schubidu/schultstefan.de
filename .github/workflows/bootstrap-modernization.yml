name: Bootstrap modernization branch

on:
  push:
    branches:
      - modernize/689-foundation

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Vendor anti-slop at reviewed upstream commit
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha='c44ef22ca116d0ba62a3ff663a0bd13a3f3fa40b'
          temp_dir="$(mktemp -d)"
          git -C "$temp_dir" init --quiet
          git -C "$temp_dir" remote add origin https://github.com/dmmulroy/anti-slop.git
          git -C "$temp_dir" fetch --quiet --depth=1 origin "$upstream_sha"
          git -C "$temp_dir" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$temp_dir" rev-parse HEAD)" = "$upstream_sha"
          rm -rf tools/oxlint/anti-slop
          mkdir -p tools/oxlint/anti-slop
          cp -R "$temp_dir/src/." tools/oxlint/anti-slop/
          cp "$temp_dir/LICENSE" tools/oxlint/anti-slop/LICENSE
          printf 'Vendored from dmmulroy/anti-slop at %s.\nLocal rule changes require explicit project review.\n' "$upstream_sha" > tools/oxlint/anti-slop/UPSTREAM.md

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated foundation inputs
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json tools/oxlint/anti-slop
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: vendor anti-slop and refresh lockfile'
          git push
