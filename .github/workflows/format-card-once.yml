name: Format contact card once

on:
  push:
    branches:
      - feat/contact-card
    paths:
      - card/index.html
      - .github/workflows/format-card-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format card
        run: npx prettier --write card/index.html

      - name: Commit formatting
        run: |
          if git diff --quiet -- card/index.html; then
            echo "Card markup is already formatted."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card/index.html
          git commit -m "style: format contact card"
          git push
