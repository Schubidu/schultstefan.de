name: Update photos

on:
  workflow_dispatch:
    inputs:
      collection_id:
        description: Unsplash collection ID
        required: true
        default: '827751'
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh photo registry
        run: npm run photos:update
        env:
          UNSPLASH_APP_SECRET: ${{ secrets.UNSPLASH_APP_SECRET }}
          UNSPLASH_COLLECTION_ID: ${{ inputs.collection_id }}

      - name: Check
        run: npm run check

      - name: Commit registry changes
        env:
          COLLECTION_ID: ${{ inputs.collection_id }}
        run: |
          if git diff --quiet -- src/unsplash-images; then
            echo "Photo registry is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/unsplash-images
          git commit -m "chore: refresh background photos from collection ${COLLECTION_ID}"
          git push
